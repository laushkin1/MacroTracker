{% extends 'tracker/base.html' %}

{% block title %}Edit Daily Limits{% endblock %}

{% block content %}
    <h2>Edit Daily Limits</h2>
    <p>Set to 0 if you don't want to track limits or see color indicators.</p>
    
    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn" style="margin-top: 15px;">Save Limits</button>
        </form>
    </div>

    <div style="text-align: center;">
        <a href="{% url 'tracker:settings' %}">&larr; Cancel</a>
    </div>
{% endblock %}
