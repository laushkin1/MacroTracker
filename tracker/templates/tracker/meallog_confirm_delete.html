<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Meal</title>
</head>
<body style="font-family: Arial; margin: 2rem;">
    <h2>Delete Meal Log</h2>
    <p>Are you sure you want to delete this meal log?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="color: red;">Yes, delete</button>
    </form>
    <a href="{% url 'tracker:dashboard' %}">Cancel</a>
</body>
</html>
