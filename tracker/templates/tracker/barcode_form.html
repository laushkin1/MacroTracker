{% extends 'tracker/base.html' %}

{% block title %}Add via Barcode{% endblock %}

{% block content %}
    <h2>Scan Barcode</h2>
    
    <div class="card">
        <form method="post" action="{% url 'tracker:add_by_barcode' %}{% if origin_date %}?date={{ origin_date }}{% endif %}">
            {% csrf_token %}
            <label style="display: block; font-weight: bold; margin-bottom: 10px;">Enter Barcode Number:</label>
            <input type="text" name="barcode" required placeholder="e.g. 5000112637922">
            <button type="submit" class="btn">Search</button>
        </form>
    </div>

    <div style="text-align: center;">
        <a href="{% url 'tracker:food_create' %}{% if origin_date %}?date={{ origin_date }}{% endif %}">&larr; Cancel</a>
    </div>
{% endblock %}
