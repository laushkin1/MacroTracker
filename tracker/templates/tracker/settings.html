<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 2rem;">
    <h2>&#9881; Settings</h2>
    
    <ul style="line-height: 2;">
        <li><a href="{% url 'tracker:username_edit' %}">Edit Username</a></li>
        <li><a href="{% url 'tracker:password_change' %}">Change Password</a></li>
        <li><a href="{% url 'tracker:profile_edit' %}">Edit Daily Limits</a></li>
        
        <li style="margin-top: 15px;">
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" style="background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                    Logout
                </button>
            </form>
        </li>
    </ul>

    <br>
    <a href="{% url 'tracker:dashboard' %}">&larr; Back to Dashboard</a>
</body>
</html>
