{% extends 'tracker/base.html' %}

{% block title %}Settings{% endblock %}

{% block content %}
    <h2>⚙️ Settings</h2>
    
    <div class="card">
        <a href="{% url 'tracker:username_edit' %}" class="btn btn-outline">Change Username</a>
        <a href="{% url 'tracker:password_change' %}" class="btn btn-outline">Change Password</a>
        <a href="{% url 'tracker:profile_edit' %}" class="btn btn-outline">Edit Daily Limits</a>
        
        <div style="margin-top: 25px; border-top: 1px solid var(--border); padding-top: 25px;">
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Logout</button>
            </form>
        </div>
    </div>

    <p style="margin-top: 20px;">Logged in as <strong>{{ user.username }}</strong></p>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="{% url 'tracker:dashboard' %}">&larr; Back to Dashboard</a>
    </div>
{% endblock %}
