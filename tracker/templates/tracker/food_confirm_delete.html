{% extends 'tracker/base.html' %}
{% block title %}Delete Food{% endblock %}
{% block content %}
    <h2>Delete Food</h2>
    <div class="card" style="text-align: center;">
        <p style="font-size: 1.1em; margin-bottom: 20px;">Are you sure you want to delete <strong>"{{ object.name }}"</strong> from Food Database?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, delete it</button>
        </form>
        <div style="margin-top: 15px;">
            <a href="{% url 'tracker:food_list' %}" class="btn btn-outline">Cancel</a>
        </div>
    </div>
{% endblock %}
