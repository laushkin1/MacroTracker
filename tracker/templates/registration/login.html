{% extends 'tracker/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
    <h2>Login</h2>
    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Login</button>
        </form>
    </div>
    <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
{% endblock %}
