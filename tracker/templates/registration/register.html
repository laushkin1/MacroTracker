{% extends 'tracker/base.html' %}

{% block title %}Register - Macro Tracker{% endblock %}

{% block content %}
    <h2>Create an Account</h2>
    
    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Sign Up</button>
        </form>
    </div>

    <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
{% endblock %}
