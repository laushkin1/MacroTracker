{% extends 'tracker/base.html' %}

{% block title %}Change Password - Macro Tracker{% endblock %}

{% block content %}
    <h2>Change Password</h2>
    
    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn" style="margin-top: 15px;">Update Password</button>
        </form>
    </div>

    <div style="text-align: center;">
        <a href="{% url 'tracker:settings' %}">&larr; Cancel</a>
    </div>
{% endblock %}
