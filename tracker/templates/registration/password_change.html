<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Macro Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; color: #333; }
        .form-container { max-width: 400px; padding: 1rem; border: 1px solid #ccc; border-radius: 8px; background-color: #fcfcfc; }
        button { margin-top: 10px; padding: 6px 12px; }
        .helptext { font-size: 0.8em; color: #666; display: block; margin-top: -10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Change Password</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Update Password</button>
        </form>
        <br>
        <a href="{% url 'tracker:dashboard' %}">Cancel and return to Dashboard</a>
    </div>
</body>
</html>
